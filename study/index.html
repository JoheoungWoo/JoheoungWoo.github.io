<!DOCTYPE html>
<html lang="ko" data-theme="light" data-mode="study">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>학습 기록 - 조형우</title>

  <meta
    name="description"
    content="학습 기록을 카테고리별로 모아 보는 글 목록.">

  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

  <link rel="stylesheet" href="../assets/css/style.css?v=20261006-5">
</head>

<body>

  <div id="site-header" data-home="false" data-nav="study-list"></div>
  <script src="../assets/js/components.js?v=20261006-3"></script>


  <main class="study-blog">

    <section class="hero container">
      <p class="eyebrow">학습 기록</p>
      <h1>학습 기록을<br>카테고리별로 모아둡니다.</h1>
      <p class="lead">
        공부한 내용을 블로그 글처럼 쌓아두는 공간입니다.
        긴 원문보다 다시 찾아보기 쉬운 목차와 요약을 우선합니다.
      </p>
    </section>


    <section id="posts" class="section container">
      <header class="section-header">
        <h2 class="eyebrow">글 목록</h2>
        <span class="post-count">0개 글</span>
      </header>

      <div class="category-filter" aria-label="카테고리 필터">
        <button type="button" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" data-filter="Java">Java</button>
        <button type="button" data-filter="Backend">Backend</button>
        <button type="button" data-filter="AI">AI</button>
        <button type="button" data-filter="Infra">Infra</button>
        <button type="button" data-filter="CS">CS</button>
      </div>

      <div class="post-list" data-render="studyPosts"></div>
    </section>

  </main>


  <div id="site-footer"></div>

  <script>
    function renderStudyPosts() {
      var buttons = document.querySelectorAll(".category-filter button");
      var postList = document.querySelector('[data-render="studyPosts"]');
      var count = document.querySelector(".post-count");
      var posts = window.STUDY_POSTS || [];

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function attr(value) {
        return escapeHtml(value || "#");
      }

      function postHtml(post) {
        return '' +
          '<a class="post-item" href="' + attr(post.studyHref || post.href) + '" data-category="' + escapeHtml(post.category) + '"' + (post.todo ? ' data-todo' : '') + '>' +
            '<span class="post-date">' + escapeHtml(post.date) + '</span>' +
            '<span class="post-category">' + escapeHtml(post.category) + '</span>' +
            '<h3>' + escapeHtml(post.title) + '</h3>' +
            '<p>' + escapeHtml(post.summary) + '</p>' +
            '<small>' + escapeHtml(post.meta || post.date) + '</small>' +
          '</a>';
      }

      if (postList) {
        postList.innerHTML = posts.map(postHtml).join("");
      }

      var postElements = document.querySelectorAll(".post-item");

      function applyFilter(category) {
        var visible = 0;

        postElements.forEach(function (post) {
          var show = category === "all" || post.dataset.category === category;
          post.hidden = !show;

          if (show) {
            visible += 1;
          }
        });

        buttons.forEach(function (button) {
          button.setAttribute(
            "aria-pressed",
            button.dataset.filter === category
          );
        });

        if (count) {
          count.textContent = visible + "개 글";
        }
      }

      buttons.forEach(function (button) {
        button.addEventListener("click", function () {
          applyFilter(button.dataset.filter);
        });
      });

      document
        .querySelectorAll("[data-todo]")
        .forEach(function (element) {
          element.setAttribute("aria-disabled", "true");
          element.addEventListener("click", function (event) {
            event.preventDefault();
          });
        });

      applyFilter("all");
    }

    (function () {
      var seed = Date.now();
      var scripts = [
        "../assets/data/study-posts-data.js?v=" + seed,
        "../assets/js/app.js?v=" + seed
      ];

      function loadScript(index) {
        var script;

        if (index >= scripts.length) {
          renderStudyPosts();
          return;
        }

        script = document.createElement("script");
        script.src = scripts[index];
        script.onload = function () {
          loadScript(index + 1);
        };
        document.body.appendChild(script);
      }

      loadScript(0);
    })();
  </script>

</body>
</html>
