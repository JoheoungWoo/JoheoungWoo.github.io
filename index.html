<!DOCTYPE html>

<!--
  CHO HYUNGWOO - ENGINEERING ARCHIVE

  이 파일은 화면 구조만 둔다.
  실제 홈 데이터는 assets/data/site-data.js 에서 읽어온다.
  내부 자료, 원문, 실험 로그, PDF 는 public GitHub 에 올리지 않는다.
-->

<html lang="ko" data-theme="light" data-mode="portfolio">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>조형우 - Engineering Archive</title>

  <meta
    name="description"
    content="프로젝트와 학습 기록을 정리하는 개인 Engineering Archive.">

  <meta property="og:title" content="조형우 - Engineering Archive">
  <meta
    property="og:description"
    content="프로젝트와 학습 기록을 정리하는 개인 Engineering Archive.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://joheoungwoo.github.io/">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body data-source="site">

  <div id="site-header" data-home="true"></div>
  <script src="./assets/js/components.js"></script>


  <main>

    <div class="mode-panel portfolio-panel">

      <section class="hero container" data-render="portfolioHero"></section>

      <section id="projects" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">SELECTED WORK</h2>
          <a href="#" data-todo>All projects →</a>
        </header>

        <div class="card-grid" data-render="projects"></div>
      </section>

      <section id="journey" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">MY JOURNEY</h2>
        </header>

        <div class="list" data-render="journey"></div>
      </section>

      <section id="archive" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">ARCHIVE BOUNDARY</h2>
          <a href="#" data-todo>Notion archive →</a>
        </header>

        <div data-render="archiveBoundary"></div>
        <div class="list archive-index" data-render="archive"></div>
      </section>

      <section id="documents" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">DOCUMENT HUB</h2>
          <a href="#" data-todo>Notion documents →</a>
        </header>

        <div class="list" data-render="documents"></div>
      </section>

    </div>


    <div class="mode-panel study-panel">

      <section class="hero container" data-render="studyHero"></section>

      <section id="topics" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">STUDY AREAS</h2>
          <a href="#" data-todo>All topics →</a>
        </header>

        <div class="card-grid" data-render="topics"></div>
        <p class="note" data-render="studyQueue"></p>
      </section>

      <section id="notes" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">RECENT NOTES</h2>
          <a href="#" data-todo>All →</a>
        </header>

        <div class="list" data-render="notes"></div>
      </section>

      <section id="reading" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">READING</h2>
        </header>

        <div class="list" data-render="reading"></div>
      </section>

    </div>

  </main>


  <div id="site-footer"></div>

  <script src="./assets/data/site-data.js"></script>
  <script src="./assets/js/app.js"></script>

</body>
</html>
