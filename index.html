<!DOCTYPE html>

<!--
  CHO HYUNGWOO - ENGINEERING ARCHIVE

  이 파일은 화면 구조만 둔다.
  실제 홈 데이터는 assets/data/*-data.js 에서 읽어온다.
  내부 자료, 원문, 실험 로그, PDF 는 public GitHub 에 올리지 않는다.
-->

<html lang="ko" data-theme="light" data-mode="portfolio">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>조형우 - 포트폴리오와 학습 기록</title>

  <meta
    name="description"
    content="포트폴리오와 학습 기록을 정리하는 개인 사이트.">

  <meta property="og:title" content="조형우 - 포트폴리오와 학습 기록">
  <meta
    property="og:description"
    content="포트폴리오와 학습 기록을 정리하는 개인 사이트.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://joheoungwoo.github.io/">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="./assets/css/style.css?v=20261006-5">
</head>

<body data-source="site">

  <div id="site-header" data-home="true"></div>
  <script src="./assets/js/components.js?v=20261006-3"></script>


  <main>

    <div class="mode-panel portfolio-panel">

      <section class="hero container" data-render="portfolioHero"></section>

      <section id="projects" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">프로젝트</h2>
          <a href="#" data-todo>전체 보기 →</a>
        </header>

        <div class="card-grid" data-render="projects"></div>
      </section>

      <section id="journey" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">작업</h2>
          <a href="#" data-todo>전체 보기 →</a>
        </header>

        <div class="list" data-render="journey"></div>
      </section>

      <section id="archive" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">정리</h2>
          <a href="#" data-todo>전체 보기 →</a>
        </header>

        <div data-render="archiveBoundary"></div>
        <div class="list archive-index" data-render="archive"></div>
      </section>

      <section id="documents" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">문서</h2>
          <a href="#" data-todo>전체 보기 →</a>
        </header>

        <div class="list" data-render="documents"></div>
      </section>

    </div>


    <div class="mode-panel study-panel">

      <section class="hero container" data-render="studyHero"></section>

      <section id="topics" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">주제</h2>
          <a href="./study/">전체 보기 →</a>
        </header>

        <div class="card-grid" data-render="topics"></div>
        <p class="note" data-render="studyQueue"></p>
      </section>

      <section id="notes" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">노트</h2>
          <a href="./study/">전체 보기 →</a>
        </header>

        <div class="list" data-render="notes"></div>
      </section>

      <section id="reading" class="section container">
        <header class="section-header">
          <h2 class="eyebrow">읽는 책</h2>
          <a href="./study/">전체 보기 →</a>
        </header>

        <div class="list" data-render="reading"></div>
      </section>

    </div>

  </main>


  <div id="site-footer"></div>

  <script>
    (function () {
      var seed = Date.now();

      var scripts = [
        "./assets/data/portfolio-data.js",
        "./assets/data/archive-data.js",
        "./assets/data/study-data.js",
        "./assets/data/study-posts-data.js"
      ];

      function loadScript(index) {
        var script;

        if (index >= scripts.length) {
          window.SITE_DATA = {
            portfolio: Object.assign(
              {},
              window.PORTFOLIO_DATA || {},
              {
                archiveBoundary: (window.ARCHIVE_DATA || {}).boundary,
                archive: (window.ARCHIVE_DATA || {}).archive,
                documents: (window.ARCHIVE_DATA || {}).documents
              }
            ),
            study: Object.assign(
              {},
              window.STUDY_DATA || {},
              {
                posts: window.STUDY_POSTS || []
              }
            )
          };

          script = document.createElement("script");
          script.src = "./assets/js/app.js?v=" + seed;
          document.body.appendChild(script);
          return;
        }

        script = document.createElement("script");
        script.src = scripts[index] + "?v=" + seed;
        script.onload = function () {
          loadScript(index + 1);
        };
        document.body.appendChild(script);
      }

      loadScript(0);
    })();
  </script>

</body>
</html>
